{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мой проект{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <h1>Мой Django-проект</h1>
        <nav>
            <a href="{% url 'home' %}">Главная</a> |
            <a href="{% url 'about' %}">О разработке</a> |

    <footer class="footer">
        <p>&copy; 2025 Мой проект. Все права защищены.</p>
    </footer>
