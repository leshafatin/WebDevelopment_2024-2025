<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NodeJS served document</title>
    <style>
      html > * {
        margin: 0;
        padding: 0;
      }

      body {
        width: 100%;
        height: 100vh;
        background: #914040;
        display: flex;
        flex-flow: column nowrap;
        justify-content: center;
        align-items: center;

        font-size: 20px;
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
        color: #fff;
      }

      area {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Этот документ отправлен сервером, написанным на NodeJS + Express</h1>
    <img src="./photo.jpg" alt="kitten" usemap="#map" />
    <map name="map">
        <area onclick="changePageColor('#0D160B')" target="" alt="" title="" href="#" coords="185,381,55" shape="circle"></area>
        <area onclick="changePageColor('#785589')" target="" alt="" title="" href="#" coords="404,384,41" shape="circle"></area>
        <area onclick="changePageColor('#977390')" target="" alt="" title="" href="#" coords="390,213,37" shape="circle"></area>
        <area onclick="changePageColor('#AC7B7D')" target="" alt="" title="" href="#" coords="208,78,246,89,336,95,386,74,391,162,352,185,343,226,312,239,262,237,242,215" shape="poly"></area>
        <area onclick="changePageColor('#BB8A89')" target="" alt="" title="" href="#" coords="155,174,225,242" shape="rect"></area>
    </map>

    <script>
        const changePageColor = (color) => {
            document.body.style.background = color
        }
    </script>
  </body>
</html>
